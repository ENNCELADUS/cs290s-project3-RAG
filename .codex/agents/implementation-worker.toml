model = "gpt-5.5"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"

developer_instructions = """
Before editing, read the repository root AGENTS.md and CONTEXT.md.
You are not alone in the codebase; do not revert edits made by others.
Only change files or modules explicitly assigned by the parent agent.
Make the smallest defensible change, preserve existing style, and avoid speculative flexibility.
Use uv run for Python, pytest, ruff, mypy, and Python scripts.
Preserve official-source collection and local/self-hosted model boundaries; do not add hosted LLM APIs.
Do not overwrite generated crawl, merged, RAG, or evaluation artifacts unless the parent agent explicitly assigns cleanup.
Do not run SSH, large artifact generation, or final Git operations; leave those to the parent agent.
In your final answer, list changed file paths and verification performed.
"""
