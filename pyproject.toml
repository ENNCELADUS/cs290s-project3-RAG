[project]
name = "cs290s-project3-rag"
version = "0.1.0"
description = "Official-source ShanghaiTech/SIST RAG system and data collection pipeline."
readme = "project3.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.0.0",
    "beautifulsoup4>=4.12.3",
    "faiss-cpu>=1.8.0",
    "gradio>=5.0.0",
    "jieba>=0.42.1",
    "lxml>=5.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.4.0",
    "protobuf>=5.27.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "python-pptx>=1.0.2",
    "rank-bm25>=0.2.2",
    "requests>=2.32.0",
    "safetensors>=0.4.5",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "sentencepiece>=0.2.0",
    "torch>=2.3.0",
    "tqdm>=4.66.0",
    "trafilatura>=1.12.0",
    "transformers>=4.45.0",
    "xlrd>=2.0.1",
]

[project.scripts]
collect-data = "rag_collection.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_collection"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
